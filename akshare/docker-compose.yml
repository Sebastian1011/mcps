services:
  akshare-mcp:
    build: .
    image: akshare-mcp:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8890:8000"
    volumes:
      # Named volume so the disk cache (7-day history TTL by default)
      # survives container recreation/upgrades. To use a bind mount
      # instead (e.g. to inspect cache.db from the host), replace with:
      #   - ./data/cache:/data/cache
      - akshare-cache:/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  akshare-cache:
