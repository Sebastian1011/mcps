[project]
name = "akshare-mcp"
version = "0.1.0"
description = "MCP server exposing akshare realtime quotes and multi-frequency history bars"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.12.0",
    "akshare>=1.18.80,<1.19",
    "pandas>=2.0.0",
    "diskcache>=5.6.3",
    "anyio>=4.4.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akshare_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit real network endpoints"]
asyncio_mode = "auto"
addopts = '-m "not live"'
